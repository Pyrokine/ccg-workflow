name: Release version tag

on:
  push:
    tags:
      - 'v*-aug.*'

permissions:
  contents: write

concurrency:
  group: version-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.repository == 'Pyrokine/ccg-workflow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate annotated version tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-aug\.[0-9]+$ ]]; then
            echo "Unsupported version tag: $tag" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
            echo "Version tags must be annotated: $tag" >&2
            exit 1
          fi

          target="$(git rev-list -n 1 "refs/tags/$tag")"
          package_version="$(git show "$target:package.json" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version))')"
          if [[ "v$package_version" != "$tag" ]]; then
            echo "Tag $tag does not match package version $package_version" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          main_version="$(git show "origin/main:package.json" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version))')"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$package_version" == "$main_version" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate.outputs.tag }}
          LATEST: ${{ steps.validate.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --latest="$LATEST"
