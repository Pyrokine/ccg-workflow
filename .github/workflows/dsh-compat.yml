name: DSH compatibility

on:
  workflow_call:
  pull_request:
    paths:
      - 'dsh-ccg/**'
      - '.github/workflows/dsh-compat.yml'
  push:
    branches: [main]
    paths:
      - 'dsh-ccg/**'
      - '.github/workflows/dsh-compat.yml'

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh-version: 0.2.0-rc.2
            react-version: 18.3.1
          - dsh-version: 0.2.1-alpha.2
            react-version: 18.3.1
          - dsh-version: 0.2.1-rc.2
            react-version: 19.3.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Install the official isolated runtime
        env:
          DSH_VERSION: ${{ matrix.dsh-version }}
          REACT_VERSION: ${{ matrix.react-version }}
        run: >-
          npm install --prefix "$RUNNER_TEMP/dsh-runtime"
          --ignore-scripts --no-audit --no-fund
          "@deepseek-ai/dsh@$DSH_VERSION"
          "@deepseek-ai/dsh-client-ui-slots@$DSH_VERSION"
          "react@$REACT_VERSION" "react-dom@$REACT_VERSION"
      - name: Validate plugin contracts and syntax
        run: |
          cp -R dsh-ccg "$RUNNER_TEMP/dsh-plugin"
          ln -s "$RUNNER_TEMP/dsh-runtime/node_modules" "$RUNNER_TEMP/dsh-plugin/node_modules"
          cd "$RUNNER_TEMP/dsh-plugin"
          DSH_CLIENT_TEST_RUNTIME="$RUNNER_TEMP/dsh-runtime" node --test test/*.test.mjs
          npm run lint
