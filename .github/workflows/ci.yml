name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.13.0, 24.19.0]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify CLI entrypoint
        run: node bin/ccg.mjs --help

  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Go build check
        working-directory: codeagent-wrapper
        run: go build -o /dev/null .

      - name: Go test
        working-directory: codeagent-wrapper
        run: go test -short ./...

      - name: Windows test compile
        working-directory: codeagent-wrapper
        run: GOOS=windows GOARCH=amd64 go test -c -o /tmp/codeagent-wrapper.test.exe .
