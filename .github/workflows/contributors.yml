name: Update Contributors

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  contributors:
    # Fork-only history omits upstream contributor credits.
    if: ${{ !github.event.repository.private && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        readme: [README.md, README.zh-CN.md]
    steps:
      - uses: actions/checkout@v7

      - uses: akhilmhdh/contributors-readme-action@v2.3.11
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          readme_path: ${{ matrix.readme }}
          columns_per_row: 7
          image_size: 100
          collaborators: all
