# CCG Codex mode does not overwrite this user's ~/.codex/config.toml.
# Current Codex releases enable the stable `hooks` and `multi_agent` features by default.
# CCG installs its Hook registration in hooks.json and its standalone roles in agents/*.toml.
# Sponsor model providers are added without changing model_provider.
#
# These are the current supported overrides when a user wants explicit values:
# [features]
# hooks = true
# multi_agent = true
#
# [agents]
# max_threads = 6
